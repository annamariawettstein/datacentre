[project]
name = "datacentre"
version = "0.1.0"
description = "UK data centre pipeline map + probability-weighted regional power-gap analysis"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Phase 1 (survival model) and Phase 3 (spatial) tooling, installed on demand.
model = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[project.scripts]
datacentre = "datacentre.cli:app"

# Vercel builds the FastAPI web app (api.py). cli.py also exposes an `app` (Typer),
# so the entrypoint must be named explicitly.
[tool.vercel]
entrypoint = "src.datacentre.api:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacentre"]
