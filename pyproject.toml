[project]
name = "datacentre"
version = "0.1.0"
description = "UK data centre planning pipeline map with capacity and on-site energy/generation extraction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "anthropic>=0.40",
    "tenacity>=9.0",
    "fastapi>=0.115",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
# Analysis / spatial tooling for the planned grid-context phase, installed on demand.
model = [
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
]

[project.scripts]
datacentre = "datacentre.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datacentre"]
